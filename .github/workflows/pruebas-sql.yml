name: Pruebas SQL

on:
  push:
    paths:
      - "sql/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/pruebas-sql.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Datos de prueba (ficticios)
        run: python3 tests/generar_datos_prueba.py tests/datos

      - name: Levantar SQL Server 2022
        run: |
          SA="Ba$(openssl rand -hex 12)!9z"
          echo "::add-mask::$SA"
          echo "SA=$SA" >> "$GITHUB_ENV"
          chmod -R a+rX tests/datos
          docker run -d --name sql -p 1433:1433 -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA" \
            -v "$GITHUB_WORKSPACE/tests/datos:/datos:ro" mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA" -Q "SELECT 1" > /dev/null 2>&1 && break
            sleep 2
          done
          docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA" -b -Q "CREATE DATABASE Banbaj; CREATE DATABASE BanbajMig; SELECT @@VERSION;"

      - name: Crear objetos (sql/*.sql en orden)
        run: |
          set -o pipefail
          : > resultado.txt
          # Cada script empieza con USE [BNABAJ_486] (la base del servidor); aquí se cambia por la base de prueba
          for f in sql/*.sql sql/instalacion/03_parametros_y_credenciales.sql; do
            grep -q '^USE \[BNABAJ_486\];' "$f" || { echo "FALLA  $f no empieza con USE [BNABAJ_486]" | tee -a resultado.txt; exit 1; }
          done
          for db in Banbaj BanbajMig; do
            mkdir -p "ci_sql/$db"
            for f in sql/*.sql; do sed "s/^USE \[BNABAJ_486\];/USE [$db];/" "$f" > "ci_sql/$db/$(basename "$f")"; done
          done
          docker cp ci_sql sql:/tmp/ci_sql
          docker cp tests sql:/tmp/tests
          for db in Banbaj BanbajMig; do
            for f in $(ls ci_sql/$db/*.sql | sort); do
              echo "== $db $f" | tee -a resultado.txt
              docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA" -I -b -f 65001 \
                -i "/tmp/$f" 2>&1 | tee -a resultado.txt
            done
          done
          # Segunda pasada sobre la base ya instalada: así se actualiza un servidor, y debe correr sin errores
          for f in $(ls ci_sql/Banbaj/*.sql | sort); do
            echo "== reinstalacion Banbaj $f" | tee -a resultado.txt
            docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA" -I -b -f 65001 \
              -i "/tmp/$f" 2>&1 | tee -a resultado.txt
          done

      - name: Pruebas de punta a punta
        run: |
          set -o pipefail
          echo "== tests/pruebas.sql" | tee -a resultado.txt
          docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA" -d Banbaj -I -b -f 65001 -W -s " | " \
            -i /tmp/tests/pruebas.sql 2>&1 | tee -a resultado.txt

      - name: Prueba de migración (CSV de FoxPro -> SQL Server)
        if: always()
        run: |
          set -o pipefail
          echo "== tests/prueba_migracion.sql" | tee -a resultado.txt
          docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA" -d BanbajMig -I -b -f 65001 -W -s " | " \
            -i /tmp/tests/prueba_migracion.sql 2>&1 | tee -a resultado.txt

      - name: Prueba de accesos remotos (sql/instalacion/04, con usuarios SQL)
        if: always()
        run: |
          set -o pipefail
          echo "== sql/instalacion/04_accesos_remotos.sql" | tee -a resultado.txt
          OP="Op$(openssl rand -hex 10)!7x"; CO="Co$(openssl rand -hex 10)!7x"
          echo "::add-mask::$OP"; echo "::add-mask::$CO"
          python3 - "$OP" "$CO" <<'EOF'
          import re, sys
          s = open('sql/instalacion/04_accesos_remotos.sql', encoding='utf-8').read()
          s = re.sub(r"INSERT INTO @accesos \(LOGIN, NIVEL, CLAVE\) VALUES.*?;\n",
                     "INSERT INTO @accesos (LOGIN, NIVEL, CLAVE) VALUES (N'ci_operador', 'OPERADOR', N'%s'), (N'ci_consulta', 'CONSULTA', N'%s'), (N'sa', 'OPERADOR', NULL);\n" % (sys.argv[1], sys.argv[2]),
                     s, count=1, flags=re.S)
          s = s.replace("DECLARE @base SYSNAME = N'BNABAJ_486';", "DECLARE @base SYSNAME = N'Banbaj';")
          open('/tmp/04_ci.sql', 'w', encoding='utf-8').write(s)
          EOF
          docker cp /tmp/04_ci.sql sql:/tmp/04_ci.sql
          docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA" -I -b -f 65001 -i /tmp/04_ci.sql 2>&1 | tee -a resultado.txt
          docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA" -I -b -f 65001 -i /tmp/04_ci.sql 2>&1 | tee -a resultado.txt   # se puede repetir
          q() { docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U "$1" -P "$2" -d Banbaj -I -b -h -1 -W -Q "SET NOCOUNT ON; $3" 2>&1; }
          ok=0; tot=0
          chk() { tot=$((tot+1)); if [ "$1" = "si" ]; then ok=$((ok+1)); echo "OK  $2" | tee -a resultado.txt; else echo "FALLA  $2" | tee -a resultado.txt; fi; }
          q ci_consulta "$CO" "SELECT COUNT(*) FROM ops.CORRIDA;" > /dev/null && r=si || r=no; chk $r "consulta lee ops.CORRIDA"
          q ci_consulta "$CO" "UPDATE cfg.PARAMETRO SET VALOR = VALOR WHERE 1 = 0;" > /dev/null && r=no || r=si; chk $r "consulta no puede escribir"
          q ci_consulta "$CO" "SELECT COUNT(*) FROM cfg.CREDENCIAL;" > /dev/null && r=no || r=si; chk $r "consulta no ve cfg.CREDENCIAL"
          q ci_operador "$OP" "SELECT COUNT(*) FROM cfg.CREDENCIAL;" > /dev/null && r=no || r=si; chk $r "operador no ve cfg.CREDENCIAL"
          out=$(q ci_operador "$OP" "DECLARE @u NVARCHAR(128), @c NVARCHAR(256); EXEC cfg.sp_credencial_leer 'X', @u OUTPUT, @c OUTPUT;" || true); echo "$out" | grep -qi "denied\|denegado" && r=si || { r=no; echo "$out" | head -3 | tee -a resultado.txt; }; chk $r "operador no puede leer credenciales"
          q ci_operador "$OP" "EXEC ops.sp_diario_486 @fecha = '2026-11-07';" > /dev/null && r=si || r=no; chk $r "operador corre sp_diario_486"
          echo "ACCESOS: $ok de $tot OK" | tee -a resultado.txt
          [ "$ok" = "$tot" ]

      - name: Limpieza de migración y pruebas (sql/instalacion/05 y 06)
        if: always()
        run: |
          set -o pipefail
          s() { docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA" -d Banbaj -I -b -f 65001 -W -s " | " "$@" 2>&1 | tee -a resultado.txt; }
          for f in 05_limpiar_migracion 06_limpiar_pruebas; do
            sed "s/^USE \[BNABAJ_486\];/USE [Banbaj];/" "sql/instalacion/$f.sql" > "/tmp/${f}_0.sql"
            sed "s/^DECLARE @confirmar \(BIT\| \)*= 0;/DECLARE @confirmar BIT = 1;/" "/tmp/${f}_0.sql" > "/tmp/${f}_1.sql"
            grep -q "^DECLARE @confirmar BIT = 1;" "/tmp/${f}_1.sql" || { echo "FALLA  $f: no se pudo poner @confirmar = 1" | tee -a resultado.txt; exit 1; }
            docker cp "/tmp/${f}_0.sql" sql:/tmp/; docker cp "/tmp/${f}_1.sql" sql:/tmp/
            echo "== sql/instalacion/$f.sql (vista previa y borrado)" | tee -a resultado.txt
            s -i "/tmp/${f}_0.sql"
            s -i "/tmp/${f}_1.sql"
          done
          # Reinstalar 80 y 85 ya limpios: no deben volver a crear nada ni fallar
          echo "== reinstalación de 80 y 85 después de limpiar" | tee -a resultado.txt
          s -i /tmp/ci_sql/Banbaj/80_sp_migracion.sql
          s -i /tmp/ci_sql/Banbaj/85_sp_pruebas_entorno.sql
          out=$(docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA" -d Banbaj -I -b -h -1 -W -Q "SET NOCOUNT ON;
            SELECT CONCAT(
              (SELECT COUNT(*) FROM sys.objects WHERE SCHEMA_NAME(schema_id) = 'ops' AND name IN ('sp_migrar_486','sp_llave_riesgo_migrar','fn_mig_faltan')), '|',
              (SELECT COUNT(*) FROM sys.objects WHERE SCHEMA_NAME(schema_id) = 'ops' AND (name LIKE 'sp[_]prueba[_]%' OR name IN ('PRUEBA_PARAM','PRUEBA_CORRIDA'))), '|',
              (SELECT COUNT(*) FROM sys.objects WHERE SCHEMA_NAME(schema_id) = 'ops' AND name IN ('sp_mig_leer','sp_mig_diagnostico')), '|',
              (SELECT COUNT(*) FROM ops.CORRIDA WHERE PROCESO = 'PRUEBA'), '|',
              (SELECT STRING_AGG(CONCAT(CLAVE, '=', VALOR), ',') WITHIN GROUP (ORDER BY CLAVE) FROM cfg.PARAMETRO WHERE CLIENTE = '486' AND CLAVE IN ('MIGRACION_LIMPIA','PRUEBAS_LIMPIAS')));" 2>&1 | tr -d '\r' | tail -1)
          esperado="0|0|2|0|MIGRACION_LIMPIA=1,PRUEBAS_LIMPIAS=1"
          if [ "$out" = "$esperado" ]; then echo "OK  LIMPIEZA: sin objetos de migración ni de pruebas; quedan sp_mig_leer y sp_mig_diagnostico" | tee -a resultado.txt
          else echo "FALLA  LIMPIEZA: esperado=[$esperado] obtenido=[$out]" | tee -a resultado.txt; exit 1; fi

      - name: Publicar resultado en la rama ci-resultados
        if: always()
        run: |
          {
            echo "commit: $GITHUB_SHA"
            echo "fecha: $(date -u +%FT%TZ)"
            echo "estado del job: ${{ job.status }}"
            echo
          } > encabezado.txt
          cat encabezado.txt resultado.txt > final.txt 2>/dev/null || cp encabezado.txt final.txt
          tmp=$(mktemp -d)
          cp final.txt "$tmp/resultado.txt"
          cd "$tmp"
          git init -q
          git config user.name "ci-banbaj"
          git config user.email "ci-banbaj@users.noreply.github.com"
          git add resultado.txt
          git commit -q -m "Resultado de pruebas para $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-resultados
